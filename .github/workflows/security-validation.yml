name: Security Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dns-tests:
    name: DNS audit regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test public DNS and Cloudflare handling offline
        run: python3 -m unittest discover -s scripts -p 'test_dns_audit.py' -v

  workflows:
    name: Workflow syntax and expressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
      - name: Install workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflow syntax and GitHub expressions
        # ShellCheck/Pyflakes are separate linters; this gate covers the
        # workflow schema, action inputs, runner labels, and expressions.
        run: actionlint -color -shellcheck='' -pyflakes=''

  go-tests:
    name: Go build, tests, and vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOFLAGS: -tags=cli
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
      - name: Verify module checksums
        run: go mod verify
      - name: Run unit tests with the race detector
        run: go test -short -race -timeout 10m ./...
      - name: Check Go code
        run: go vet ./...
      - name: Build the CLI agent
        run: |
          mkdir -p "$RUNNER_TEMP/agent-build"
          go build -trimpath -o "$RUNNER_TEMP/agent-build/arduino-cloud-agent_cli" .
          cd "$RUNNER_TEMP/agent-build"
          sha256sum arduino-cloud-agent_cli > SHA256SUMS.txt
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable vulnerable functions
        # Text mode returns a failure when reachable vulnerabilities are found.
        run: govulncheck -tags cli ./...
      - name: Upload verified Linux CLI build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arduino-cloud-agent-cli-linux
          path: ${{ runner.temp }}/agent-build/
          if-no-files-found: error
          retention-days: 3
