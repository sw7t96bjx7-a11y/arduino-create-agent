name: Cloudflare DNS Audit (read-only)

on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Comma-separated public domain names to check'
        type: string
        required: true
        default: 'example.com'
      check_cloudflare:
        description: 'Optional zone check using the cloudflare-audit environment'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  public_dns:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate domain input
        env:
          DOMAINS_INPUT: ${{ inputs.domains }}
        run: python3 scripts/dns_audit.py validate

      - name: Install DNS query tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Collect public DNS records
        id: collect
        continue-on-error: true
        env:
          DOMAINS_INPUT: ${{ inputs.domains }}
        run: python3 scripts/dns_audit.py public

      - name: Upload public DNS report
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-dns-audit
          path: reports/public/
          if-no-files-found: error
          retention-days: 3

      - name: Report failed DNS queries
        if: ${{ !cancelled() && steps.collect.outcome == 'failure' }}
        run: |
          echo '::error::One or more DNS queries failed. Review the public DNS artifact for per-query status.'
          exit 1

  cloudflare:
    if: ${{ inputs.check_cloudflare }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-audit
    steps:
      - name: Require the reviewed main branch
        env:
          AUDIT_REF: ${{ github.ref }}
        run: |
          if [ "$AUDIT_REF" != 'refs/heads/main' ]; then
            echo '::error::The Cloudflare check is restricted to the reviewed main branch. Run the public DNS audit with the Cloudflare option disabled on other branches.'
            exit 1
          fi

      - name: Checkout audit code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Cloudflare zone access and record counts
        env:
          DOMAINS_INPUT: ${{ inputs.domains }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 scripts/dns_audit.py cloudflare
