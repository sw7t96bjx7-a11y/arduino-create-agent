[tool.poetry]
name = "arduino-create-agent"
version = "0.1.0"
description = "Project used to run end-to-end test for the Arduino Create Agent"
authors = ["Umberto Baldi <u.baldi@arduino.cc>", "Maurizio Branca <m.branca@arduino.cc>"]
license = "GPLv2"

[tool.poetry.dependencies]
python = "^3.12"
pytest = "^7.4.4"
requests = "^2.25.1"
# The agent uses Socket.IO protocol 4 / Engine.IO protocol 3.
# python-socketio 5 is not compatible with the existing Go server.
python-socketio = { version = "^4.6.1", extras = ["client"] }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
